[project]
name = "vlearn"
version = "2.0.0"
description = "VLearn — AI Thực Chiến: study workspace 3-panel với AI Tutor đa-agent (slide RAG + research paper arXiv + summary + memory)."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.141",
  "uvicorn>=0.52",
  "langgraph>=1.2",
  "langchain-core>=1.5",
  "langchain-openai>=1.4",
  "google-genai>=2.19",
  "pypdf>=6.14",
  "pymupdf>=1.28",
  "openai>=2.50",
  "python-dotenv>=1.2",
  "requests>=2.34",
  "dotenv>=0.9",
  "duckduckgo_search>=8.1",
]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "libs/rag/tests"]
